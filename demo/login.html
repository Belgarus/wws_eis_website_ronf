<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Ice Cream Vendor Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        ice: {
                            cream: '#FDFCF0',
                            strawberry: '#FF8A8A',
                            chocolate: '#634832',
                            mint: '#98FF98',
                            cone: '#D2B48C'
                        }
                    }
                }
            }
        }
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; }
        .fade-in { animation: fadeIn 0.5s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body class="bg-ice-cream min-h-screen flex items-center justify-center p-4">

    <div class="max-w-md w-full bg-white rounded-2xl shadow-xl overflow-hidden fade-in">
        <div class="bg-ice-chocolate p-8 text-center text-white">
            <h1 class="text-3xl font-bold tracking-tight">Eis-Portal</h1>
            <p class="text-ice-cone mt-2">Herzlich willkommen zurück</p>
        </div>

        <form id="loginForm" class="p-8 space-y-6" onsubmit="handleLogin(event)">
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-2">Ich bin ein...</label>
                <div class="grid grid-cols-2 gap-4">
                    <label class="relative flex items-center justify-center p-4 border-2 rounded-xl cursor-pointer hover:bg-gray-50 transition-all border-gray-200" id="label-kunde">
                        <input type="radio" name="role" value="customer" class="hidden" checked onchange="updateRoleUI()">
                        <span class="text-sm font-semibold text-gray-600">Kunde</span>
                    </label>
                    <label class="relative flex items-center justify-center p-4 border-2 rounded-xl cursor-pointer hover:bg-gray-50 transition-all border-gray-200" id="label-vendor">
                        <input type="radio" name="role" value="vendor" class="hidden" onchange="updateRoleUI()">
                        <span class="text-sm font-semibold text-gray-600">Großhändler</span>
                    </label>
                </div>
            </div>

            <div class="space-y-4">
                <div class="relative group">
                    <label for="email" class="block text-xs font-semibold text-gray-500 uppercase mb-1">E-Mail Adresse</label>
                    <input type="email" id="email" required 
                        class="w-full px-4 py-3 bg-gray-50 border border-gray-200 rounded-lg focus:ring-2 focus:ring-ice-chocolate focus:border-transparent outline-none transition-all peer"
                        placeholder="beispiel@eis.de">
                    <p class="mt-1 hidden peer-invalid:block text-red-500 text-xs italic">Bitte geben Sie eine gültige E-Mail-Adresse ein.</p>
                </div>

                <div class="relative group">
                    <label for="password" class="block text-xs font-semibold text-gray-500 uppercase mb-1">Passwort</label>
                    <input type="password" id="password" required 
                        class="w-full px-4 py-3 bg-gray-50 border border-gray-200 rounded-lg focus:ring-2 focus:ring-ice-chocolate focus:border-transparent outline-none transition-all"
                        placeholder="••••••••">
                    <p class="mt-1 text-gray-400 text-[10px]">Hinweis: Jedes Passwort wird für die Demo akzeptiert.</p>
                </div>
            </div>

            <button type="submit" 
                class="w-full bg-ice-chocolate hover:bg-opacity-90 text-white font-bold py-3 rounded-lg shadow-lg transform hover:-translate-y-0.5 transition-all">
                Anmelden
            </button>
        </form>
    </div>

    <script>
        function updateRoleUI() {
            const radios = document.getElementsByName('role');
            radios.forEach(r => {
                const label = document.getElementById(`label-${r.value === 'customer' ? 'kunde' : 'vendor'}`);
                if (r.checked) {
                    label.classList.add('border-ice-strawberry', 'bg-red-50');
                    label.classList.remove('border-gray-200');
                } else {
                    label.classList.remove('border-ice-strawberry', 'bg-red-50');
                    label.classList.add('border-gray-200');
                }
            });
        }

        function handleLogin(event) {
            event.preventDefault();
            const role = document.querySelector('input[name="role"]:checked').value;
            if (role === 'customer') {
                window.location.href = 'customer-dashboard.html';
            } else {
                window.location.href = 'vendor-dashboard.html';
            }
        }

        // Initialize UI
        updateRoleUI();
    </script>
</body>
</html>
