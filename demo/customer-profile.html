<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profil - Ice Cream Vendor Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        ice: {
                            cream: '#FDFCF0',
                            strawberry: '#FF8A8A',
                            chocolate: '#634832',
                            mint: '#98FF98',
                            cone: '#D2B48C'
                        }
                    }
                }
            }
        }
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-gray-50 min-h-screen flex">

    <!-- Sidebar -->
    <aside class="w-64 bg-ice-chocolate text-white flex-shrink-0 flex flex-col hidden md:flex">
        <div class="p-6">
            <h2 class="text-2xl font-bold tracking-wider text-ice-strawberry">EIS-PORTAL</h2>
            <p class="text-xs text-ice-cone">Kunden-Bereich</p>
        </div>
        <nav class="mt-6 flex-1 px-4 space-y-2">
            <a href="customer-dashboard.html" class="flex items-center px-4 py-3 hover:bg-white hover:bg-opacity-5 rounded-lg transition-colors">
                <span class="font-medium text-gray-300">Eis bestellen</span>
            </a>
            <a href="customer-orders.html" class="flex items-center px-4 py-3 hover:bg-white hover:bg-opacity-5 rounded-lg transition-colors">
                <span class="font-medium text-gray-300">Meine Bestellungen</span>
            </a>
            <a href="customer-profile.html" class="flex items-center px-4 py-3 bg-white bg-opacity-10 rounded-lg text-ice-strawberry">
                <span class="font-medium">Profil</span>
            </a>
        </nav>
        <div class="p-4 border-t border-white border-opacity-10">
            <a href="login.html" class="text-sm text-gray-400 hover:text-white transition-colors">Abmelden</a>
        </div>
    </aside>

    <!-- Main Content -->
    <main class="flex-1 p-8 overflow-y-auto">
        <header class="mb-8">
            <h1 class="text-3xl font-bold text-gray-800">Mein Profil</h1>
            <p class="text-gray-500">Verwalten Sie Ihre persönlichen Daten und Firmeneinstellungen.</p>
        </header>

        <div class="max-w-4xl bg-white rounded-2xl shadow-sm border border-gray-100 overflow-hidden">
            <div class="p-8">
                <form class="space-y-6">
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                        <div>
                            <label class="block text-xs font-semibold text-gray-500 uppercase mb-1">Name des Eiscafés</label>
                            <input type="text" value="Eiscafé Venezia" class="w-full px-4 py-2 bg-gray-50 border border-gray-200 rounded-lg focus:ring-2 focus:ring-ice-strawberry outline-none">
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-gray-500 uppercase mb-1">Inhaber</label>
                            <input type="text" value="Mario Rossi" class="w-full px-4 py-2 bg-gray-50 border border-gray-200 rounded-lg focus:ring-2 focus:ring-ice-strawberry outline-none">
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-gray-500 uppercase mb-1">E-Mail Adresse</label>
                            <input type="email" value="mario@venezia-eis.de" class="w-full px-4 py-2 bg-gray-50 border border-gray-200 rounded-lg focus:ring-2 focus:ring-ice-strawberry outline-none">
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-gray-500 uppercase mb-1">Telefonnummer</label>
                            <input type="text" value="+49 123 456789" class="w-full px-4 py-2 bg-gray-50 border border-gray-200 rounded-lg focus:ring-2 focus:ring-ice-strawberry outline-none">
                        </div>
                    </div>

                    <div class="pt-6 border-t border-gray-100">
                        <h3 class="font-bold text-gray-800 mb-4">Lieferadresse</h3>
                        <div class="space-y-4">
                            <div>
                                <label class="block text-xs font-semibold text-gray-500 uppercase mb-1">Straße & Hausnummer</label>
                                <input type="text" value="Eismarkt 12" class="w-full px-4 py-2 bg-gray-50 border border-gray-200 rounded-lg focus:ring-2 focus:ring-ice-strawberry outline-none">
                            </div>
                            <div class="grid grid-cols-3 gap-4">
                                <div class="col-span-1">
                                    <label class="block text-xs font-semibold text-gray-500 uppercase mb-1">PLZ</label>
                                    <input type="text" value="12345" class="w-full px-4 py-2 bg-gray-50 border border-gray-200 rounded-lg focus:ring-2 focus:ring-ice-strawberry outline-none">
                                </div>
                                <div class="col-span-2">
                                    <label class="block text-xs font-semibold text-gray-500 uppercase mb-1">Stadt</label>
                                    <input type="text" value="Eisstadt" class="w-full px-4 py-2 bg-gray-50 border border-gray-200 rounded-lg focus:ring-2 focus:ring-ice-strawberry outline-none">
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="flex justify-end pt-4">
                        <button type="button" class="bg-ice-strawberry text-white font-bold px-8 py-3 rounded-xl shadow-lg hover:bg-opacity-90 transition-all">
                            Änderungen speichern
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </main>
</body>
</html>
